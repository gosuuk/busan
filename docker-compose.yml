services:
  postgres:
    image: postgres:17-alpine
    container_name: busan-it-community-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: busan
      POSTGRES_PASSWORD: busan_dev_password
      POSTGRES_DB: busan_it_community_dev
    volumes:
      - busan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U busan -d busan_it_community_dev",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  busan_postgres_data:
